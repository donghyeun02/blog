<svg xmlns="http://www.w3.org/2000/svg" width="752" height="396" viewBox="0 0 752 396"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1D1D1F"/></marker></defs><rect width="752" height="396" fill="#FAFAFA"/><text x="24" y="34" font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" fill="#1D1D1F" font-weight="700" text-anchor="start" opacity="1" dominant-baseline="middle">패킷이 통과해야 하는 네 개의 관문</text><text x="24" y="58" font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" fill="#6E6E73" font-weight="400" text-anchor="start" opacity="1" dominant-baseline="middle">어디서 막혀도 사람이 보는 증상은 똑같다</text><rect x="24" y="96" width="430" height="52" rx="0" fill="none" stroke="#1D1D1F" stroke-width="1.7"/><text x="40" y="117" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#0E7490" font-weight="700" text-anchor="start" opacity="1" dominant-baseline="middle">1</text><text x="64" y="117" font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" fill="#1D1D1F" font-weight="700" text-anchor="start" opacity="1" dominant-baseline="middle">Route Table</text><text x="64" y="134" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#6E6E73" font-weight="400" text-anchor="start" opacity="1" dominant-baseline="middle">어디로 보낼지 정한다</text><text x="470" y="117" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#AEAEB2" font-weight="400" text-anchor="start" opacity="1" dominant-baseline="middle">목적지 경로 없음</text><text x="470" y="134" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#0E7490" font-weight="400" text-anchor="start" opacity="1" dominant-baseline="middle">↓  증상: 타임아웃</text><path d="M 239 148 L 239 162" fill="none" stroke="#1D1D1F" stroke-width="1.5" marker-end="url(#ah)" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="162" width="430" height="52" rx="0" fill="none" stroke="#1D1D1F" stroke-width="1.7"/><text x="40" y="183" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#0E7490" font-weight="700" text-anchor="start" opacity="1" dominant-baseline="middle">2</text><text x="64" y="183" font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" fill="#1D1D1F" font-weight="700" text-anchor="start" opacity="1" dominant-baseline="middle">NACL</text><text x="64" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#6E6E73" font-weight="400" text-anchor="start" opacity="1" dominant-baseline="middle">Subnet 경계에서 검사</text><text x="470" y="183" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#AEAEB2" font-weight="400" text-anchor="start" opacity="1" dominant-baseline="middle">반환 규칙 없음</text><text x="470" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#0E7490" font-weight="400" text-anchor="start" opacity="1" dominant-baseline="middle">↓  증상: 타임아웃</text><path d="M 239 214 L 239 228" fill="none" stroke="#1D1D1F" stroke-width="1.5" marker-end="url(#ah)" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="228" width="430" height="52" rx="0" fill="none" stroke="#1D1D1F" stroke-width="1.7"/><text x="40" y="249" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#0E7490" font-weight="700" text-anchor="start" opacity="1" dominant-baseline="middle">3</text><text x="64" y="249" font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" fill="#1D1D1F" font-weight="700" text-anchor="start" opacity="1" dominant-baseline="middle">ACG</text><text x="64" y="266" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#6E6E73" font-weight="400" text-anchor="start" opacity="1" dominant-baseline="middle">서버 NIC에서 검사</text><text x="470" y="249" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#AEAEB2" font-weight="400" text-anchor="start" opacity="1" dominant-baseline="middle">포트 미허용</text><text x="470" y="266" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#0E7490" font-weight="400" text-anchor="start" opacity="1" dominant-baseline="middle">↓  증상: 타임아웃</text><path d="M 239 280 L 239 294" fill="none" stroke="#1D1D1F" stroke-width="1.5" marker-end="url(#ah)" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="294" width="430" height="52" rx="0" fill="none" stroke="#1D1D1F" stroke-width="1.7"/><text x="40" y="315" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#0E7490" font-weight="700" text-anchor="start" opacity="1" dominant-baseline="middle">4</text><text x="64" y="315" font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" fill="#1D1D1F" font-weight="700" text-anchor="start" opacity="1" dominant-baseline="middle">Service</text><text x="64" y="332" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#6E6E73" font-weight="400" text-anchor="start" opacity="1" dominant-baseline="middle">그 포트를 듣고 있는가</text><text x="470" y="315" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#AEAEB2" font-weight="400" text-anchor="start" opacity="1" dominant-baseline="middle">프로세스 미기동</text><text x="470" y="332" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#0E7490" font-weight="400" text-anchor="start" opacity="1" dominant-baseline="middle">↓  증상: 타임아웃</text><text x="24" y="358" font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#6E6E73" font-weight="400" text-anchor="start" opacity="1" dominant-baseline="middle">— 넷 중 하나만 비어 있어도 통신은 안 된다. 그런데 증상은 넷 다 같다</text><text x="24" y="376" font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#6E6E73" font-weight="400" text-anchor="start" opacity="1" dominant-baseline="middle">— 서버를 먼저 띄우지 않고 길부터 깐 이유가 여기에 있다</text></svg>