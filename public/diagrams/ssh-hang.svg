<svg xmlns="http://www.w3.org/2000/svg" width="752" height="204" viewBox="0 66 752 204"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1D1D1F"/></marker></defs><rect x="0" y="66" width="752" height="204" fill="#FAFAFA"/><text x="24" y="30" font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" fill="#1D1D1F" font-weight="700" text-anchor="start" opacity="1" dominant-baseline="middle">SSH</text><text x="24" y="52" font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#5A5F66" font-weight="400" text-anchor="start" opacity="1" dominant-baseline="middle">요청은 도착했고 응답이 버려졌다</text><rect x="24" y="86" width="704" height="84" rx="0" fill="#1D1D1F" stroke="#1D1D1F" stroke-width="1.2"/><text x="42" y="110" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#E8EAED" font-weight="400" text-anchor="start" opacity="1" dominant-baseline="middle">ubuntu@cnp-s01-ops-mgmt-svr:~$ ssh 10.60.48.6</text><text x="42" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#F28B82" font-weight="400" text-anchor="start" opacity="1" dominant-baseline="middle">confused 에러</text><text x="710" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#9AA0A6" font-weight="400" text-anchor="end" opacity="1" dominant-baseline="middle">포트가 닫혔다는 말은 아니다</text><image href="data:image/png;base64," x="55.0" y="199.0" width="38" height="38"/><text x="103.0" y="218" font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#1D1D1F" font-weight="600" text-anchor="start" opacity="1" dominant-baseline="middle">ops-mgmt</text><image href="data:image/png;base64," x="519.0" y="199.0" width="38" height="38"/><text x="567.0" y="218" font