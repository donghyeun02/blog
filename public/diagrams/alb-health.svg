<svg xmlns="http://www.w3.org/2000/svg" width="752" height="270" viewBox="0 66 752 270"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1D1D1F"/></marker></defs><rect x="0" y="66" width="752" height="270" fill="#FAFAFA"/><text x="24" y="30" font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" fill="#1D1D1F" font-weight="700" text-anchor="start" opacity="1" dominant-baseline="middle">헬스체크가 깨졌을 때</text><text x="24" y="52" font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#5A5F66" font-weight="400" text-anchor="start" opacity="1" dominant-baseline="middle">쿠버네티스 쪽만 봐서는 원인이 안 보인다</text><circle cx="74" cy="124" r="20" fill="#1E88E5"/><circle cx="74" cy="119" r="6" fill="#FFF"/><path d="M 64 137 a 10 9 0 0 1 20 0 Z" fill="#FFF"/><text x="74" y="160" font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#1D1D1F" font-weight="600" text-anchor="middle" opacity="1" dominant-baseline="middle">사용자</text><path d="M 102 114 L 202 114" fill="none" stroke="#1D1D1F" stroke-width="1.1" marker-end="url(#ah)" stroke-linecap="round" stroke-linejoin="round"/><text x="152" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#5A5F66" font-weight="400" text-anchor="middle" opacity="1" dominant-baseline="middle">HTTP</text><path d="M 202 136 L 106 136" fill="none" stroke="#1D1D1F" stroke-width="1.1" stroke-dasharray="4 4" marker-end="url(#ah)" stroke-linecap="round" stroke-linejoin="round"/><rect x="138.77" y="127" width="30.46" height="18" fill="#FAFAFA" stroke="none"/><text x="154" y="136" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#6E6E73" font-weight="400" text-anchor="middle" opacity="1" dominant-baseline="middle">503</text><image