xt-anchor="start" opacity="1" dominant-baseline="middle">같은 시점에 두 쪽이 다르게 보인다</text><path d="M 376.0 254 L 376.0 302" fill="none" stroke="#1D1D1F" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="200.0" y="270" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#9AA0A6" font-weight="400" text-anchor="middle" opacity="1" dominant-baseline="middle">kubectl get pods</text><text x="200.0" y="290" font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#1D1D1F" font-weight="700" text-anchor="middle" opacity="1" dominant-baseline="middle">전부 Running · 문제 없음</text><text x="552.0" y="270" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#9AA0A6" font-weight="400" text-anchor="middle" opacity="1" dominant-baseline="middle">콘솔 · 로드밸런서 상태</text><text x="552.0" y="290" font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#5A5F66" font-weight="700" text-anchor="middle" opacity="1" dominant-baseline="middle">모든 노드 비정상</text><text x="24" y="350" font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" fill="#5A5F66" font-weight="400" text-anchor="start" opacity="1" dominant-baseline="middle">· 연속 성공·실패 횟수로 판정하므로 망가질 때도 회복될 때도 즉시가 아니다</text><text x="24" y="367" font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" fill="#5A5F66" font-weight="400" text-anchor="start" opacity="1" dominant-baseline="middle">· 고치고 바로 확인해서 안 고쳐졌다고 판단하면 안 되는 이유다</text></svg>