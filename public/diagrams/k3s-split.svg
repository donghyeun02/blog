<svg xmlns="http://www.w3.org/2000/svg" width="752" height="296" viewBox="0 0 752 296"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1D1D1F"/></marker></defs><rect width="752" height="296" fill="#FAFAFA"/><text x="24" y="34" font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" fill="#1D1D1F" font-weight="700" text-anchor="start" opacity="1" dominant-baseline="middle">노드가 안 붙은 게 아니라 클러스터가 두 개가 됐다</text><text x="24" y="58" font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" fill="#6E6E73" font-weight="400" text-anchor="start" opacity="1" dominant-baseline="middle">설치 스크립트에 K3S_URL을 넘기지 않으면 각자 마스터가 된다</text><circle cx="200" cy="158" r="52" fill="none" stroke="#1D1D1F" stroke-width="1.7"/><image href="data:image/png;base64," x="186" y="138" width="28" height="28"/><text x="200" y="186" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#0E7490" font-weight="400" text-anchor="middle" opacity="1" dominant-baseline="middle">k3s.service</text><text x="200" y="228" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#6E6E73" font-weight="400" text-anchor="middle" opacity="1" dominant-baseline="middle">cnp-s01-k3s-srv-kr1-svr</text><text x="200" y="246" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8.5" fill="#AEAEB2" font-weight="400" text-anchor="middle" opacity="1" dominant-baseline="middle">curl -sfL get.k3s.io | sh -</text><text x="200" y="90" font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#AEAEB2" font-weight="700" text-anchor="middle" opacity="1" dominant-baseline="middle">클러스터 1</text><circle cx="552" cy="158" r="52" fill="none" stroke="#1D1D1F" stroke-width="1.7"/><image href="data:image/png;base64," x="538" y="138" width="28" height="28"/><text x="552" y="186" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#0E7490" font-weight="400" text-anchor="middle" opacity="1" dominant-baseline="middle">k3s.service</text><text x="552" y="228" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#6E6E73" font-weight="400" text-anchor="middle" opacity="1" dominant-baseline="middle">cnp-s01-k3s-agt-kr2-svr</text><text x="552" y="246" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8.5" fill="#AEAEB2" font-weight="400" text-anchor="middle" opacity="1" dominant-baseline="middle">curl -sfL get.k3s.io | sh -</text><text x="552" y="90" font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#AEAEB2" font-weight="700" text-anchor="middle" opacity="1" dominant-baseline="middle">클러스터 2</text><path d="M 264 158 L 488 158" fill="none" stroke="#1D1D1F" stroke-width="1.5" stroke-dasharray="4 4" stroke-linecap="round" stroke-linejoin="round"/><line x1="385.0" y1="149" x2="0" y2="0" stroke="none"/><line x1="367.0" y1="149" x2="0" y2="0" stroke="none"/><line x1="367.0" y1="149" x2="385.0" y2="167" stroke="#1D1D1F" stroke-width="2.4" stroke-linecap="round"/><line x1="385.0" y1="149" x2="367.0" y2="167" stroke="#1D1D1F" stroke-width="2.4" stroke-linecap="round"/><text x="24" y="276" font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#6E6E73" font-weight="400" text-anchor="start" opacity="1" dominant-baseline="middle">— 에러는 나지 않는다. 설치는 성공했고 결과가 원한 것과 달랐을 뿐이다</text></svg>