ont-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#5A5F66" font-weight="700" text-anchor="start" opacity="1" dominant-baseline="middle">Pod가 없는 노드로 들어와도 응답이 온다</text><text x="42" y="266" font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#1D1D1F" font-weight="600" text-anchor="start" opacity="1" dominant-baseline="middle">외부 요청</text><path d="M 96 266 L 186 266" fill="none" stroke="#1D1D1F" stroke-width="1.1" marker-end="url(#ah)" stroke-linecap="round" stroke-linejoin="round"/><image href="data:image/png;base64," x="205.0" y="251.0" width="30" height="30"/><text x="220" y="295.0" font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#1D1D1F" font-weight="600" text-anchor="middle" opacity="1" dominant-baseline="middle">노드 A</text><text x="220" y="310.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#9AA0A6" font-weight="400" text-anchor="middle" opacity="1" dominant-baseline="middle">Pod 없음</text><path d="M 256 266 L 494 266" fill="none" stroke="#1D1D1F" stroke-width="1.1" marker-end="url(#ah)" stroke-linecap="round" stroke-linejoin="round"/><rect x="318.85" y="241" width="112.30000000000001" height="18" fill="#FAFAFA" stroke="none"/><text x="375" y="250" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#6E6E73" font-weight="400" text-anchor="middle" opacity="1" dominant-baseline="middle">kube-proxy가 넘긴다</text><image href="data:image/png;base64," x="515.0" y="251.0" width="30" height="30"/><text x="530" y="295.0" font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#1D1D1F" font-weight="600" text-anchor="middle" opacity="1" dominant-baseline="middle">노드 B</text><text x="530" y="310.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#9AA0A6" font-weight="400" text-anchor="middle" opacity="1" dominant-baseline="middle">Pod 2개</text><text x="24" y="374" font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" fill="#5A5F66" font-weight="400" text-anchor="start" opacity="1" dominant-baseline="middle">· 요청은 nodePort → port → targetPort 순으로 지나간다. 셋 다 다른 숫자여도 된다</text><text x="24" y="391" font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" fill="#5A5F66" font-weight="400" text-anchor="start" opacity="1" dominant-baseline="middle">· nodePort는 30000-32767 범위에서 고르고, 안 적으면 자동으로 배정된다</text></svg>