<svg xmlns="http://www.w3.org/2000/svg" width="752" height="300" viewBox="0 0 752 300"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1D1D1F"/></marker></defs><rect width="752" height="300" fill="#FAFAFA"/><text x="24" y="34" font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" fill="#1D1D1F" font-weight="700" text-anchor="start" opacity="1" dominant-baseline="middle">나가는 문과 들어오는 문은 같은 문이 아니다</text><text x="24" y="58" font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" fill="#6E6E73" font-weight="400" text-anchor="start" opacity="1" dominant-baseline="middle">Internet Gateway와 NAT Gateway의 방향 비교</text><rect x="24.0" y="88" width="340.0" height="178" rx="0" fill="none" stroke="#1D1D1F" stroke-width="1.8"/><text x="40.0" y="110" font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#1D1D1F" font-weight="700" text-anchor="start" opacity="1" dominant-baseline="middle">Internet Gateway</text><text x="40.0" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#6E6E73" font-weight="400" text-anchor="start" opacity="1" dominant-baseline="middle">Public Subnet의 인터넷 경로</text><rect x="44.0" y="152" width="110" height="40" rx="0" fill="none" stroke="#1D1D1F" stroke-width="1.4"/><text x="99.0" y="172" font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#1D1D1F" font-weight="400" text-anchor="middle" opacity="1" dominant-baseline="middle">인터넷</text><rect x="234.0" y="152" width="110" height="40" rx="0" fill="none" stroke="#1D1D1F" stroke-width="1.4"/><text x="289.0" y="172" font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#1D1D1F" font-weight="400" text-anchor="middle" opacity="1" dominant-baseline="middle">서버</text><path d="M 156.0 164 L 232.0 164" fill="none" stroke="#1D1D1F" stroke-width="1.5" marker-end="url(#ah)" stroke-linecap="round" stroke-linejoin="round"/><path d="M 232.0 186 L 156.0 186" fill="none" stroke="#1D1D1F" stroke-width="1.5" marker-end="url(#ah)" stroke-linecap="round" stroke-linejoin="round"/><text x="194.0" y="216" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#0E7490" font-weight="400" text-anchor="middle" opacity="1" dominant-baseline="middle">양쪽 다 열린다</text><text x="194.0" y="234" font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="8.5" fill="#AEAEB2" font-weight="400" text-anchor="middle" opacity="1" dominant-baseline="middle">위: 밖에서 안으로   아래: 안에서 밖으로</text><rect x="388.0" y="88" width="340.0" height="178" rx="0" fill="none" stroke="#1D1D1F" stroke-width="1.8"/><text x="404.0" y="110" font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#1D1D1F" font-weight="700" text-anchor="start" opacity="1" dominant-baseline="middle">NAT Gateway</text><image href="data:image/png;base64," x="684.0" y="100" width="24" height="24"/><text x="404.0" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#6E6E73" font-weight="400" text-anchor="start" opacity="1" dominant-baseline="middle">Private 서버가 먼저 시작한 연결만</text><rect x="408.0" y="152" width="110" height="40" rx="0" fill="none" stroke="#1D1D1F" stroke-width="1.4"/><text x="463.0" y="172" font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#1D1D1F" font-weight="400" text-anchor="middle" opacity="1" dominant-baseline="middle">인터넷</text><rect x="598.0" y="152" width="110" height="40" rx="0" fill="none" stroke="#1D1D1F" stroke-width="1.4"/><text x="653.0" y="172" font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#1D1D1F" font-weight="400" text-anchor="middle" opacity="1" dominant-baseline="middle">서버</text><path d="M 520.0 164 L 596.0 164" fill="none" stroke="#1D1D1F" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#ah)" stroke-linecap="round" stroke-linejoin="round"/><line x1="565.0" y1="157" x2="0" y2="0" stroke="none"/><line x1="551.0" y1="157" x2="0" y2="0" stroke="none"/><line x1="551.0" y1="157" x2="565.0" y2="171" stroke="#1D1D1F" stroke-width="2.4" stroke-linecap="round"/><line x1="565.0" y1="157" x2="551.0" y2="171" stroke="#1D1D1F" stroke-width="2.4" stroke-linecap="round"/><path d="M 596.0 186 L 520.0 186" fill="none" stroke="#1D1D1F" stroke-width="1.5" marker-end="url(#ah)" stroke-linecap="round" stroke-linejoin="round"/><text x="558.0" y="216" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#0E7490" font-weight="400" text-anchor="middle" opacity="1" dominant-baseline="middle">나가는 방향만 열린다</text><text x="558.0" y="234" font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="8.5" fill="#AEAEB2" font-weight="400" text-anchor="middle" opacity="1" dominant-baseline="middle">위: 밖에서 안으로   아래: 안에서 밖으로</text><text x="24" y="282" font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#6E6E73" font-weight="400" text-anchor="start" opacity="1" dominant-baseline="middle">— NAT에 공인 IP가 붙어 있어도 그 주소로 사설 서버에 들어올 수는 없다</text></svg>